name: Social Poster (Facebook + Instagram)

# Runs 3x/day. Calls the social-poster Supabase Edge Function, which posts up
# to a few of the oldest published articles that haven't been shared yet to
# Facebook and/or Instagram, using a real Unsplash photo and a caption built
# from the article's actual title/description — no invented content.
# All secrets (Facebook, Instagram, Unsplash) live in Supabase, not here.
#
# Was a single run/day posting one article/run — with content-pipeline
# publishing roughly 1-2 articles/day, the backlog never cleared (31 of 35
# published articles had never been posted, confirmed 2026-08-09). Running
# more often, paired with the function now processing a small batch per
# call, lets it actually catch up instead of falling further behind.

on:
  schedule:
    - cron: "0 */8 * * *"   # 00:00, 08:00, 16:00 UTC
  workflow_dispatch: {}       # allow manual trigger from the GitHub Actions UI

jobs:
  run-social-poster:
    name: Post latest article to social
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call social-poster Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/social-poster" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::social-poster returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Social Poster Run" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.call.outputs.body }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
