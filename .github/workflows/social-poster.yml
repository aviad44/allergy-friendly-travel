name: Social Poster (Facebook + Instagram)

# Runs once daily. Calls the social-poster Supabase Edge Function, which
# posts the single newest published article that hasn't been shared yet to
# Facebook and/or Instagram, using a real Unsplash photo and a caption built
# from the article's actual title/description — no invented content.
# All secrets (Facebook, Instagram, Unsplash) live in Supabase, not here.
#
# By design this doesn't try to work through older unposted articles from
# before this automation existed — one fresh post a day is the goal, not
# catching up on backlog.

on:
  schedule:
    - cron: "0 15 * * *"   # daily at 15:00 UTC
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Optional: comma-separated article slugs to post right now (skips the oldest-first backlog pick for the still-missing platform(s) only, e.g. to clear one flagged article out of turn).'
        required: false
        default: ''

jobs:
  run-social-poster:
    name: Post latest article to social
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call social-poster Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
          SLUGS_INPUT: ${{ inputs.slugs }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          if [ -n "$SLUGS_INPUT" ]; then
            BODY_JSON=$(python3 -c "import json,os; print(json.dumps({'slugs': [s.strip() for s in os.environ['SLUGS_INPUT'].split(',') if s.strip()]}))")
          else
            BODY_JSON='{}'
          fi

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/social-poster" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d "$BODY_JSON")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::social-poster returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        env:
          BODY: ${{ steps.call.outputs.body }}
        run: |
          echo "## Social Poster Run" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
