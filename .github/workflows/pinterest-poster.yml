name: Pinterest Poster (backlog sweep)

# Runs once daily. Calls the pinterest-poster Supabase Edge Function, which
# pins a small batch (oldest-unposted-first) of already-published articles
# that were never sent to Pinterest — either because they predate the
# integration or because the one-shot pin attempt in content-pipeline
# failed. Unlike social-poster (Facebook/Instagram), which by design only
# ever chases the newest article, this deliberately works through the full
# backlog over time: Pinterest content has long-tail search value, so an
# old article is still worth pinning, not just a fresh one.
# All secrets (Pinterest) live in Supabase, not here.

on:
  schedule:
    - cron: "30 15 * * *"   # daily at 15:30 UTC, offset from social-poster's 15:00
  workflow_dispatch: {}       # allow manual trigger from the GitHub Actions UI

jobs:
  run-pinterest-poster:
    name: Pin backlog batch to Pinterest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call pinterest-poster Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/pinterest-poster" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::pinterest-poster returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Pinterest Poster Run" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.call.outputs.body }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
