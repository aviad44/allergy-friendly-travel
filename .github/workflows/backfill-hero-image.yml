name: Backfill Hero Images

# One-off maintenance workflow (no schedule) — calls the backfill-hero-image
# Supabase Edge Function, which finds every published article missing a
# hero_image_url and fetches one from Unsplash. Needed because that Edge
# Function requires network access + the Unsplash key that only exist in
# Supabase/GitHub Actions, not in the dev/session environment that inserts
# articles directly via SQL (e.g. a manual content backfill).

on:
  workflow_dispatch: {}

jobs:
  run-backfill:
    name: Run hero image backfill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call backfill-hero-image Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/backfill-hero-image" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::backfill-hero-image returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Hero Image Backfill Run" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.call.outputs.body }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Netlify rebuild
        if: success()
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK_URL secret not set — skipping rebuild trigger"
            exit 0
          fi
          curl -sS -X POST "$NETLIFY_BUILD_HOOK_URL"
