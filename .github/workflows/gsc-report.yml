name: Search Console Report

# Runs weekly. Calls the gsc-report Supabase Edge Function, which pulls real
# Google Search Console data (Search Analytics + an indexing spot-check) —
# closing the "no GSC API access, only screenshots the user pastes" gap
# noted in CLAUDE.md. Report-only: this never edits seo_articles, never
# calls Google's Indexing API, and never changes anything live — it just
# stores a weekly page-level snapshot and surfaces simple opportunities
# (low-CTR pages, near-page-1 rankings, zero-click pages, unindexed pages)
# in the job summary and in pipeline_log for the weekly site-health Routine
# to pick up.
#
# Requires the GOOGLE_SEARCH_CONSOLE_CREDENTIALS Supabase secret (a Google
# service-account JSON key, with that service account added as a
# read-only user on the Search Console property) — see CLAUDE.md for setup.
# Until that secret exists, this runs and fails with a clear "not
# configured" message rather than doing nothing silently.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch: {}    # allow manual trigger from the GitHub Actions UI

jobs:
  run-gsc-report:
    name: Pull Search Console report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call gsc-report Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/gsc-report" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::gsc-report returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Search Console Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.call.outputs.body }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
