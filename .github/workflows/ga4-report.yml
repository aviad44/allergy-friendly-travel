name: GA4 Hotel Booking Click Report

# Runs weekly. Calls the ga4-report Supabase Edge Function, which pulls
# real Google Analytics 4 data — specifically the hotel_booking_click event
# (fired on every "Book Now" click, see src/utils/googleAnalytics.ts) broken
# down by hotel and by page. Closes a gap found 2026-09-29: 94 of these
# clicks had accumulated over ~2 months with no visibility into which
# hotels/destinations they were on, beyond manually digging through GA4
# Explore. Report-only: never edits seo_articles or anything else live —
# just logs a summary to pipeline_log for the weekly site-health Routine
# to pick up.
#
# Requires the GOOGLE_ANALYTICS_CREDENTIALS and GA4_PROPERTY_ID Supabase
# secrets (a Google service-account JSON key with the Analytics Data API
# enabled and added as a Viewer on the GA4 property, plus that property's
# numeric ID) — see CLAUDE.md for setup. The same service account used for
# GOOGLE_SEARCH_CONSOLE_CREDENTIALS can be reused here. Until both secrets
# exist, this runs and fails with a clear "not configured" message rather
# than doing nothing silently.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC — same slot as gsc-report
  workflow_dispatch: {}    # allow manual trigger from the GitHub Actions UI

jobs:
  run-ga4-report:
    name: Pull GA4 hotel booking click report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call ga4-report Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/ga4-report" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::ga4-report returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        env:
          BODY: ${{ steps.call.outputs.body }}
        run: |
          echo "## GA4 Hotel Booking Click Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
