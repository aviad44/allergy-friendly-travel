name: Content Pipeline (Real Hotel Discovery + Article Generation)

# Runs daily. Calls the content-pipeline Supabase Edge Function, which:
#   1. Discovers real hotels for the next destination via Google Places, keeping
#      only reviews that actually mention food allergies (no AI-invented content).
#   2. Writes an SEO article grounded only in that real evidence and publishes it.
# All secrets (Google Places, OpenAI) live in Supabase, not here — this workflow
# only needs the public Supabase URL and anon key, both already committed in .env.
#
# Manual runs can target a specific destination instead of the automatic
# rotation by filling in the city + country inputs (e.g. to fulfil a direct
# request for a destination not yet in DESTINATIONS) — content_type still
# picks hotel vs restaurant, and needs to be run once per type since a single
# manual-override run only ever produces one article.

on:
  schedule:
    # Daily at 09:00 UTC — with hotel/restaurant alternation, each content
    # type still publishes roughly every 2 days, matching the original
    # hotel-only cadence from before restaurants existed.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      content_type:
        description: "Force hotel or restaurant instead of the automatic alternation (leave blank for normal runs)"
        type: choice
        options: ["", "hotel", "restaurant"]
        default: ""
      city:
        description: "Manual override: specific city to discover instead of the next one in rotation (requires country too, leave both blank for normal runs)"
        type: string
        default: ""
      country:
        description: "Manual override: country for the city above"
        type: string
        default: ""

jobs:
  run-pipeline:
    name: Run content pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Call content-pipeline Edge Function
        id: call
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
          CITY: ${{ github.event.inputs.city }}
          COUNTRY: ${{ github.event.inputs.country }}
        run: |
          SUPABASE_URL=$(grep '^VITE_SUPABASE_URL=' .env | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d'"' -f2)

          # jq builds the body so city/country/contentType are safely
          # JSON-escaped regardless of what's typed into the dispatch inputs.
          REQUEST_BODY=$(jq -n \
            --arg contentType "$CONTENT_TYPE" \
            --arg city "$CITY" \
            --arg country "$COUNTRY" \
            '{}
             + (if $contentType != "" then {contentType: $contentType} else {} end)
             + (if $city != "" and $country != "" then {city: $city, country: $country} else {} end)')

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$SUPABASE_URL/functions/v1/content-pipeline" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SHARED_SECRET" \
            -d "$REQUEST_BODY")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::content-pipeline returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## Content Pipeline Run" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.call.outputs.body }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # New/updated articles live in Supabase and don't need a rebuild to be
      # visible to real users (the app fetches them client-side) — but the
      # static prerendered snapshot bots see (see scripts/prerender.mjs) is
      # only regenerated on deploy. Trigger one so that snapshot stays fresh.
      - name: Trigger Netlify rebuild
        if: success()
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::warning::NETLIFY_BUILD_HOOK_URL secret not set — skipping rebuild trigger"
            exit 0
          fi
          curl -sS -X POST "$NETLIFY_BUILD_HOOK_URL"
