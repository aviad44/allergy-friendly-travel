
<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, shrink-to-fit=no" />
    <title>Allergy-Friendly Travel Guide | Safe Hotels & Tips for Dietary Restrictions</title>
    
    <!-- Favicon - updated to use the new logo -->
    <!-- Pre-resized from the 1024px/620KB logo PNG, which was being fetched
         at full size just to draw a 32px tab icon. -->
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#005566" />
    <meta name="msapplication-TileColor" content="#005566" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Critical CSS Inlining (optimized above-the-fold styles) -->
    <style>
      /* Critical path CSS for fastest rendering */
      body{margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;font-display:swap}
      .hero-section{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center}
      /* Preload critical font */
      @font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:local('Poppins Regular'),local('Poppins-Regular')}
    </style>
    
    <!--
      No hand-written preloads for /src/main.tsx or /src/index.css: Vite
      already emits the real hashed entry script, its modulepreloads and the
      CSS link at build time. The old <link rel="preload" href="/src/main.tsx">
      was being inlined by Vite into a data: URI of the raw TypeScript source
      (useless bytes in every page), and no hero-image preload lives here on
      purpose — this shell is shared by every route; MetaManager preloads the
      correct per-route image dynamically.
    -->

    <!-- Optimized font loading with only essential weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;600&display=swap" /></noscript>
    
    <!-- Preconnect for external resources with crossorigin -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    
    <!-- DNS prefetch as fallback -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    
    <!-- Primary Meta Tags -->
    <meta name="author" content="Allergy Free Travel" />
    <meta name="keywords" content="allergy-friendly travel, food allergy hotels, gluten-free accommodation, dairy-free travel, nut-free hotels, allergen-free vacation, safe travel with allergies" />

    <!-- Pinterest domain verification (Business Hub -> claim website), so
         pins linking to this site show the site's own branding instead of
         nothing, and site-wide Pinterest Analytics becomes available. Must
         live in the static shell (not injected by React) since Pinterest's
         verifier doesn't execute JS. -->
    <meta name="p:domain_verify" content="858e1936fed90edfc21e8725f80dac38"/>

    <!--
      Per-page description, canonical, og:*, twitter:*, robots, and JSON-LD
      are all set dynamically per route by MetaManager (react-helmet-async) —
      see src/components/MetaManager.tsx. Do NOT hardcode them here: this
      file is the one static shell served for every route (SPA), so a
      hardcoded canonical/description/og:url here creates a SECOND,
      conflicting tag alongside MetaManager's correct per-route one on every
      non-homepage page (e.g. two different <link rel="canonical"> on
      /destinations/paris — one pointing here at "/", one at the real page).
      That confused Google into potentially canonicalizing destination pages
      back to the homepage. Verified live via Search Console's Rich Results
      Test on 2026-07-20 before this fix.
    -->

    <!--
      Analytics (GA4) + Meta Pixel, loaded on first interaction.
      Both stubs (gtag -> dataLayer, fbq -> queue) are defined immediately, so
      every call made before the real scripts arrive (PageView, the Search
      event in src/pages/SearchResults.tsx, hotel_booking_click, ...) is
      queued, not lost. The heavy scripts themselves (gtag.js ~187KB,
      fbevents.js + config ~208KB) are only injected on the visitor's first
      scroll/tap/keypress, or 5s after window 'load', whichever comes first —
      previously they loaded right at 'load', competing with the mobile first
      view for bandwidth and main-thread time (PageSpeed, 2026-10-07).
      Trade-off, agreed with the site owner: a visitor who leaves within ~5s
      without interacting isn't counted by either. Pixel use is disclosed in
      Privacy.tsx.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5PWZX00PL4', { 'send_page_view': false });
      gtag('event', 'page_view');

      !function(f){if(f.fbq)return;var n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];}(window);
      fbq('init', '1064364525938635');
      fbq('track', 'PageView');

      (function () {
        var loaded = false;
        var events = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
        function addScript(src) {
          var s = document.createElement('script');
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;
          events.forEach(function (e) { window.removeEventListener(e, loadAnalytics, { passive: true }); });
          addScript('https://www.googletagmanager.com/gtag/js?id=G-5PWZX00PL4');
          addScript('https://connect.facebook.net/en_US/fbevents.js');
        }
        events.forEach(function (e) { window.addEventListener(e, loadAnalytics, { passive: true }); });
        window.addEventListener('load', function () { setTimeout(loadAnalytics, 5000); });
      })();
    </script>
    <!-- Critical CSS will be loaded via main.tsx for better control -->
</head>
<body>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1064364525938635&amp;ev=PageView&amp;noscript=1"
      alt="" /></noscript>
    <div id="root"></div>
    <!-- Move all non-critical scripts to end of body for better performance -->
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
